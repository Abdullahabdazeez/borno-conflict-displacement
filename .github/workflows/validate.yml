name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate public portfolio package
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys

          root = Path('.')
          failures = []
          required = [
              'README.md', 'LICENSE', 'CITATION.cff', 'project.json',
              '05_Documentation/PROJECT_REPORT.md',
              '07_Report/Borno_Settlement_Change_FINAL_VALIDATED_Technical_Report.pdf',
              '06_Project_Board/Borno_FINAL_VALIDATED_Project_Board.png',
              '01_Maps/01_Validated_Settlement_Change_Classification.png',
              '02_Charts/03_Final13_Evidence_Profile.png'
          ]

          for rel in required:
              p = root / rel
              if not p.exists() or p.stat().st_size == 0:
                  failures.append(f'Missing or empty: {rel}')

          try:
              json.loads((root / 'project.json').read_text(encoding='utf-8'))
          except Exception as exc:
              failures.append(f'Invalid project.json: {exc}')

          readme = (root / 'README.md').read_text(encoding='utf-8', errors='replace')
          for term in ['2,455', 'Priority contraction', 'Priority change signal', 'Confirmed abandoned settlements']:
              if term.lower() not in readme.lower():
                  failures.append(f'README missing expected final content: {term}')

          for p in root.rglob('*'):
              if p.is_file() and p.stat().st_size > 95 * 1024 * 1024:
                  failures.append(f'File exceeds 95 MB: {p}')

          if failures:
              print('VALIDATION FAILED')
              for item in failures:
                  print('-', item)
              sys.exit(1)

          print('VALIDATION PASSED')
          print('Borno public portfolio package and final interpretation are present.')
          PY
